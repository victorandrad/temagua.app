# Frontend (shell Angular + mapa React + painel/métricas Vue, servidos pelo Nginx).
#
#   CI (npm ci) ─┬─ Lint (ESLint + typecheck) ─┬─ Deploy no VPS
#                └─ Build (npm run build → imagem) ─┘
#
# O build é feito uma vez só: os dist viram a imagem ghcr.io/victorandrad/temagua-web:<commit>
# (docker/web.dist.Dockerfile, só copia os dist para o Nginx) e o VPS apenas a baixa.
name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'tem-agua/apps/shell/**'
      - 'tem-agua/apps/mapa/**'
      - 'tem-agua/apps/painel/**'
      - 'tem-agua/apps/metricas/**'
      - 'tem-agua/packages/contracts/**'
      - 'tem-agua/docker/web.dist.Dockerfile*'
      - 'tem-agua/docker/nginx.conf.template'
      - 'tem-agua/eslint.config.mjs'
      - 'tem-agua/package.json'
      - 'tem-agua/package-lock.json'
      - 'compose.yaml'
      - 'compose.producao.yaml'
      - '.github/workflows/frontend.yml'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:

concurrency:
  group: frontend
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGEM: ghcr.io/victorandrad/temagua-web

# node_modules do npm ci passa do job CI para os outros pelo cache (chave = package-lock), sem instalar de novo.
jobs:
  ci:
    name: CI (npm ci)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: node_modules em cache
        id: cache
        uses: actions/cache@v4
        with:
          key: nm-${{ runner.os }}-${{ hashFiles('tem-agua/package-lock.json') }}
          path: |
            tem-agua/node_modules
            tem-agua/apps/*/node_modules
            tem-agua/packages/*/node_modules
      - name: Instalar dependências (npm ci)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: tem-agua
        run: npm ci

  lint:
    name: Lint (ESLint e typecheck)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tem-agua
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache/restore@v4
        with:
          key: nm-${{ runner.os }}-${{ hashFiles('tem-agua/package-lock.json') }}
          fail-on-cache-miss: true
          path: |
            tem-agua/node_modules
            tem-agua/apps/*/node_modules
            tem-agua/packages/*/node_modules
      - name: ESLint dos front-ends
        run: npm run lint:frontend
      - name: Typecheck (mapa, painel, métricas)
        run: npm run typecheck

  build:
    name: Build (npm run build → imagem)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: tem-agua
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache/restore@v4
        with:
          key: nm-${{ runner.os }}-${{ hashFiles('tem-agua/package-lock.json') }}
          fail-on-cache-miss: true
          path: |
            tem-agua/node_modules
            tem-agua/apps/*/node_modules
            tem-agua/packages/*/node_modules
      - name: Build (remotos + shell)
        run: npm run build
      - name: Login no registro do GitHub
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Imagem com os dist e publicação
        run: |
          docker build -f docker/web.dist.Dockerfile \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t "$IMAGEM:${{ github.sha }}" -t "$IMAGEM:latest" .
          docker push "$IMAGEM:${{ github.sha }}"
          docker push "$IMAGEM:latest"

  deploy:
    name: Deploy no VPS
    needs: [lint, build]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-vps.yml
    with:
      parte: frontend
      conferir: /remotes/mapa/remoteEntry.js
    secrets: inherit
