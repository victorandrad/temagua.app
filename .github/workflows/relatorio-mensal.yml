# Relatório mensal: no dia 1 gera o PDF do mês que fechou a partir da página pública
# /relatorios/AAAA-MM (tem-agua/scripts/relatorio-mensal.mjs, Chrome headless), guarda em
# tem-agua/apps/shell/public/relatorios/AAAA-MM.pdf e dispara o Frontend para publicar.
# O link fica fixo: https://<site>/relatorios/AAAA-MM.pdf (a página do mês mostra "Baixar PDF").
#
# Push feito com o GITHUB_TOKEN não dispara outros workflows; por isso o Frontend é chamado com
# "gh workflow run" (workflow_dispatch é a exceção a essa regra).
name: Relatório mensal

on:
  schedule:
    - cron: '0 9 1 * *' # dia 1, 06:00 em Salto
  workflow_dispatch:
    inputs:
      mes:
        description: 'Mês (AAAA-MM); vazio = mês anterior'
        required: false

concurrency:
  group: relatorio-mensal
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  SITE: https://saltotemagua.victorandra.de

jobs:
  gerar:
    name: gerar-pdf
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mês do relatório
        id: mes
        env:
          MES: ${{ inputs.mes }}
        run: |
          if [ -z "$MES" ]; then
            MES=$(TZ=America/Sao_Paulo date -d "$(TZ=America/Sao_Paulo date +%Y-%m-01) -1 day" +%Y-%m)
          fi
          if ! echo "$MES" | grep -Eq '^[0-9]{4}-(0[1-9]|1[0-2])$'; then
            echo "Mês inválido: $MES" >&2
            exit 1
          fi
          echo "mes=$MES" >> "$GITHUB_OUTPUT"
          # Só gera se o mês teve relatos.
          if curl -fsS "$SITE/api/relatorios/meses" | node -e '
            let d = ""; process.stdin.on("data", (c) => (d += c)).on("end", () =>
              process.exit(JSON.parse(d).some((x) => x.mes === process.argv[1]) ? 0 : 1));' "$MES"; then
            echo "tem=1" >> "$GITHUB_OUTPUT"
          else
            echo "Sem relatos em $MES: nada a gerar." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Gerar o PDF
        if: steps.mes.outputs.tem == '1'
        env:
          MES: ${{ steps.mes.outputs.mes }}
        run: |
          # puppeteer-core numa pasta à parte: não entra no package-lock do projeto.
          PASTA="$RUNNER_TEMP/pdf"
          mkdir -p "$PASTA"
          npm install --prefix "$PASTA" --no-save --no-audit --no-fund puppeteer-core@24.43.1
          cp tem-agua/scripts/relatorio-mensal.mjs "$PASTA/"
          node "$PASTA/relatorio-mensal.mjs" "$SITE" "$MES" "$PASTA/$MES.pdf"
          mkdir -p tem-agua/apps/shell/public/relatorios
          cp "$PASTA/$MES.pdf" "tem-agua/apps/shell/public/relatorios/$MES.pdf"

      - name: Guardar no repositório e publicar
        if: steps.mes.outputs.tem == '1'
        env:
          MES: ${{ steps.mes.outputs.mes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "tem-agua/apps/shell/public/relatorios/$MES.pdf"
          if git diff --cached --quiet; then
            echo "PDF de $MES igual ao publicado." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Relatório mensal de $MES (PDF gerado automaticamente)"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run frontend.yml --ref main
          echo "PDF publicado em $SITE/relatorios/$MES.pdf (após o deploy do Frontend)." >> "$GITHUB_STEP_SUMMARY"
