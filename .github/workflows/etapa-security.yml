# Etapa "security": procura vulnerabilidades conhecidas nas dependências (base OSV.dev, a mesma do
# Dependabot e do npm audit) e publica o resultado na aba Security → Code scanning, no resumo do run e
# em issues (uma por vulnerabilidade, fechada sozinha quando ela some da varredura).
# Não bloqueia o deploy: vulnerabilidade em dependência indireta muitas vezes ainda não tem correção.
name: Etapa security

on:
  workflow_call:

permissions:
  contents: read

jobs:
  osv-scanning:
    name: osv-scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Varredura do package-lock (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        # Sai com código 1 quando acha vulnerabilidade; quem trata o resultado é o próximo job.
        continue-on-error: true
        with:
          scan-args: |-
            --format=sarif
            --output=osv.sarif
            --lockfile=tem-agua/package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: osv-sarif
          path: osv.sarif
          if-no-files-found: error
          retention-days: 7

  report-security-issues:
    name: report-security-issues
    needs: osv-scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      issues: write
    # Backend e frontend rodam a mesma varredura no mesmo push: um por vez, para não abrir issue duplicada.
    concurrency:
      group: seguranca-issues
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: osv-sarif
      - name: Publicar em Security → Code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: osv.sarif
          category: osv-scanner
      - name: Resumo e avisos no run
        run: |
          total=$(jq '[.runs[].results[]] | length' osv.sarif)
          {
            echo "## 🔒 Dependências (OSV)"
            if [ "$total" -eq 0 ]; then
              echo "Nenhuma vulnerabilidade conhecida no \`package-lock.json\`. ✅"
            else
              echo "**$total** alerta(s) — detalhes em *Security → Code scanning*."
              echo
              echo "| Vulnerabilidade | Detalhe |"
              echo "|---|---|"
              jq -r '.runs[].results[] | "| \(.ruleId) | \(.message.text | split("\n")[0] | .[0:160]) |"' osv.sarif
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.runs[].results[] | "::warning title=\(.ruleId)::\(.message.text | split("\n")[0])"' osv.sarif

      # Uma issue por vulnerabilidade (título "[segurança] <id> · <pacote> · <gravidade>", label "segurança").
      # Já aberta: não duplica. Sumiu da varredura (dependência atualizada): a issue é fechada com um comentário.
      - name: Abrir e fechar issues das vulnerabilidades
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create "segurança" --color B60205 --description "Vulnerabilidade encontrada pela etapa security (OSV)" --force >/dev/null
          gh label create "dependências" --color 0366D6 --description "Atualização de dependência" --force >/dev/null
          abertas=$(gh issue list --label "segurança" --state open --limit 500 --json number,title)
          jq -r '.runs[].results[].ruleId' osv.sarif | sort -u > encontradas.txt

          while read -r id; do
            [ -n "$id" ] || continue
            if jq -e --arg id "$id" 'any(.[]; .title | contains("] " + $id + " ·"))' <<< "$abertas" > /dev/null; then
              echo "$id: issue já aberta"
              continue
            fi
            pacote=$(jq -r --arg id "$id" '[.runs[].results[] | select(.ruleId == $id) | .message.text | capture("Package .(?<p>[^ ]+). is vulnerable").p] | unique | join(", ")' osv.sarif)
            gravidade=$(jq -r --arg id "$id" 'first(.runs[].tool.driver.rules[] | select(.id == $id)) | (.properties["security-severity"] // "") as $s
              | if $s == "" then "gravidade não informada"
                else ($s | tonumber) as $n | (if $n >= 9 then "crítica" elif $n >= 7 then "alta" elif $n >= 4 then "média" else "baixa" end) + " (" + $s + ")" end' osv.sarif)
            {
              echo "**Pacote:** \`$pacote\`"
              echo "**Gravidade:** $gravidade"
              echo "**Onde:** \`tem-agua/package-lock.json\` · encontrada no commit ${GITHUB_SHA::7} ([execução]($RUN_URL))"
              echo
              echo "---"
              echo
              jq -r --arg id "$id" 'first(.runs[].tool.driver.rules[] | select(.id == $id)) | (.help.markdown // .fullDescription.text // "") | .[0:60000]' osv.sarif
              echo
              echo "---"
              echo "_Aberta automaticamente pela etapa **security** (OSV-Scanner). Ela fecha sozinha quando a vulnerabilidade sumir da varredura, por exemplo depois de atualizar a dependência._"
            } > corpo.md
            # < /dev/null: o gh não pode ler a lista que alimenta o laço.
            gh issue create --title "[segurança] $id · $pacote · $gravidade" --label "segurança" --label "dependências" --body-file corpo.md < /dev/null
          done < encontradas.txt

          jq -r '.[] | "\(.number)\t\(.title)"' <<< "$abertas" | while IFS=$'\t' read -r numero titulo; do
            id=$(sed -n 's/^\[segurança\] \([^ ]*\) ·.*/\1/p' <<< "$titulo")
            [ -n "$id" ] || continue
            if ! grep -qxF "$id" encontradas.txt; then
              gh issue close "$numero" --reason completed \
                --comment "Não aparece mais na varredura do commit ${GITHUB_SHA::7} ([execução]($RUN_URL)): a dependência foi atualizada ou a vulnerabilidade saiu da base. ✅" < /dev/null
            fi
          done
