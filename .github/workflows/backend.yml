# Backend (API Node + PostgreSQL).
#
#   install ── security ── code-analyzing ── build-app ── build-image ── deploy
#   npm ci      osv-scanning  linting          build-app:   build-image:   deploy:producao
#               report-…      typecheck        producao     producao
#
# Cada etapa é um workflow reutilizável (etapa-*.yml): o GitHub desenha cada uma como uma caixa com
# os jobs dentro. No build-app a API sobe contra um PostGIS e precisa responder; a imagem
# ghcr.io/victorandrad/temagua-api é gerada uma vez só e o VPS apenas a baixa.
name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'tem-agua/apps/api/**'
      - 'tem-agua/docker/api.Dockerfile'
      # A API lê estes dados dos contracts (páginas de bairro e setores de abastecimento).
      - 'tem-agua/packages/contracts/src/bairros.json'
      - 'tem-agua/packages/contracts/src/abastecimento.json'
      - 'tem-agua/eslint.config.mjs'
      - 'tem-agua/package.json'
      - 'tem-agua/package-lock.json'
      - 'compose.yaml'
      - 'compose.producao.yaml'
      - '.github/workflows/backend.yml'
      - '.github/workflows/etapa-*.yml'
      - '.github/workflows/deploy-vps.yml'
      - '.github/actions/**'
  workflow_dispatch:

# Um por vez; um push novo espera o anterior terminar em vez de cancelá-lo no meio.
concurrency:
  group: backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  install:
    name: install
    uses: ./.github/workflows/etapa-install.yml

  security:
    name: security
    needs: install
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/etapa-security.yml

  code-analyzing:
    name: code-analyzing
    needs: security
    uses: ./.github/workflows/etapa-code-analyzing.yml
    with:
      parte: backend

  build-app:
    name: build-app
    needs: code-analyzing
    uses: ./.github/workflows/etapa-build-app.yml
    with:
      parte: backend

  build-image:
    name: build-image
    needs: build-app
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/etapa-build-image.yml
    with:
      parte: backend

  deploy:
    name: deploy
    needs: build-image
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-vps.yml
    with:
      parte: backend
      conferir: /api/reports?horas=1
    secrets: inherit
