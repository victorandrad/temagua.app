# Backend (API Node + PostgreSQL).
#
#   CI (npm ci) ─┬─ Lint (ESLint da API) ─┬─ Deploy no VPS
#                └─ Build (imagem da API) ─┘
#
# O build é feito uma vez só: a imagem ghcr.io/victorandrad/temagua-api:<commit> é publicada no
# registro do GitHub e o VPS apenas a baixa.
name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'tem-agua/apps/api/**'
      - 'tem-agua/docker/api.Dockerfile'
      # A API lê estes dados dos contracts (páginas de bairro e setores de abastecimento).
      - 'tem-agua/packages/contracts/src/bairros.json'
      - 'tem-agua/packages/contracts/src/abastecimento.json'
      - 'tem-agua/eslint.config.mjs'
      - 'tem-agua/package.json'
      - 'tem-agua/package-lock.json'
      - 'compose.yaml'
      - 'compose.producao.yaml'
      - '.github/workflows/backend.yml'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:

# Um por vez; um push novo espera o anterior terminar em vez de cancelá-lo no meio.
concurrency:
  group: backend
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGEM: ghcr.io/victorandrad/temagua-api

# node_modules do npm ci passa do job CI para os outros pelo cache (chave = package-lock), sem instalar de novo.
jobs:
  ci:
    name: CI (npm ci)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: node_modules em cache
        id: cache
        uses: actions/cache@v4
        with:
          key: nm-${{ runner.os }}-${{ hashFiles('tem-agua/package-lock.json') }}
          path: |
            tem-agua/node_modules
            tem-agua/apps/*/node_modules
            tem-agua/packages/*/node_modules
      - name: Instalar dependências (npm ci)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: tem-agua
        run: npm ci

  lint:
    name: Lint (ESLint da API)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tem-agua
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache/restore@v4
        with:
          key: nm-${{ runner.os }}-${{ hashFiles('tem-agua/package-lock.json') }}
          fail-on-cache-miss: true
          path: |
            tem-agua/node_modules
            tem-agua/apps/*/node_modules
            tem-agua/packages/*/node_modules
      - name: ESLint da API
        run: npm run lint:backend

  build:
    name: Build (imagem da API)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: tem-agua
    steps:
      - uses: actions/checkout@v4
      - name: Login no registro do GitHub
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Imagem da API e publicação
        run: |
          docker build -f docker/api.Dockerfile \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t "$IMAGEM:${{ github.sha }}" -t "$IMAGEM:latest" .
          docker push "$IMAGEM:${{ github.sha }}"
          docker push "$IMAGEM:latest"

  deploy:
    name: Deploy no VPS
    needs: [lint, build]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-vps.yml
    with:
      parte: backend
      conferir: /api/reports?horas=1
    secrets: inherit
